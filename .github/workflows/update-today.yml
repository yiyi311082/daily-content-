name: Update Today Content

on:
  workflow_dispatch:
    inputs:
      content:
        description: '今日内容'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write content to today.txt
        run: |
          cat > today.txt << 'EOF'
          ${{ github.event.inputs.content }}
          EOF
      - name: Commit and push
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add today.txt
          git diff --cached --quiet || git commit -m "每日更新 $(date +'%Y-%m-%d')"
          git push
